<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rice Grain Classification</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .container {
            width: 450px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .35);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            color: #eeeeee;
            margin-bottom: 25px;
        }

        .upload {
            border: 2px dashed rgba(255, 255, 255, .6);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        input[type=file] {
            width: 100%;
            color: white;
        }

        input[type=file]::file-selector-button {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00b894;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #019875;
        }

        .result {
            margin-top: 30px;
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 20px;
        }

        .result img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #00b894;
            margin-bottom: 20px;
        }

        .prediction {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
            margin-top: 10px;
        }

        .confidence {
            font-size: 18px;
            margin-top: 10px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #27ae60;
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🌾 Rice Grain Classifier</h1>

        <p>Upload a rice grain image to identify its variety using Machine Learning.</p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="upload">

                <input type="file"
                       name="image"
                       accept="image/*"
                       required>

            </div>

            <button type="submit">
                Predict Variety
            </button>

        </form>

        {% if prediction %}

        <div class="result">

            <img src="{{ image }}" alt="Rice Image">

            <h2>Prediction Result</h2>

            <div class="prediction">
                {{ prediction }}
            </div>

            <div class="confidence">
                Confidence : {{ confidence }}%
            </div>

            <div class="progress">
                <div class="progress-fill" style="width: {{ confidence }}%;"></div>
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
